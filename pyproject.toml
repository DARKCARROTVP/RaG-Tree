[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-tree-reproduction"
version = "0.1.0"
description = "Auditable research implementation of RaG-Tree for range-filtered ANNS"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
hnsw = ["hnswlib>=0.8.0"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["rag_tree*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
